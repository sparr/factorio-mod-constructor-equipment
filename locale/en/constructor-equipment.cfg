[equipment-description]
constructor-equipment=An arm on your back that builds the ghosts you walk past, reaching 2 tiles. Draws about 15 kW while working, and nothing while idle. Wear more than one for more arms. In a vehicle's grid it is mounted on the hull, builds as the vehicle drives out of the vehicle's own inventory; equipment in your armour is idle while you are in a vehicle.
constructor-equipment-2=An arm on your back that builds the ghosts you walk past, reaching 3 tiles. Draws about 18 kW while working. In a vehicle's grid it is mounted on the hull, builds as the vehicle drives out of the vehicle's own inventory; equipment in your armour is idle while you are in a vehicle.
constructor-equipment-3=An arm on your back that builds the ghosts you walk past, reaching 4 tiles. Draws about 46 kW while working. In a vehicle's grid it is mounted on the hull and builds as the vehicle drives, out of the vehicle's own inventory; equipment in your armour is idle while you are in a vehicle.
constructor-equipment-4=An arm on your back that builds the ghosts you walk past, reaching 5 tiles. Draws about 120 kW while working. Its bulk claw carries as many as a bulk inserter, putting several down for one reach out. In a vehicle's grid it is mounted on the hull and builds as the vehicle drives, out of the vehicle's own inventory; equipment in your armour is idle while you are in a vehicle.

